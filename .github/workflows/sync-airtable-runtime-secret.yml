name: Sync FoodOS Airtable Runtime Secret

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Sync Airtable PAT to Cloudflare Worker version secret
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$AIRTABLE_API_KEY" ]; then
            echo "GitHub Actions AIRTABLE_API_KEY is absent."
            exit 1
          fi
          printf '%s' "$AIRTABLE_API_KEY" | bunx wrangler versions secret put AIRTABLE_API_KEY --name household-state-engine --message "Sync Airtable runtime secret"
          echo "AIRTABLE_API_KEY synced to a new Worker version without exposing its value or requiring the latest deployed version."

      - name: Sync Production read token to Cloudflare Worker version secret
        env:
          FOODOS_PRODUCTION_READ_TOKEN: ${{ secrets.FOODOS_PRODUCTION_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$FOODOS_PRODUCTION_READ_TOKEN" ]; then
            echo "GitHub Actions FOODOS_PRODUCTION_READ_TOKEN is absent."
            exit 1
          fi
          printf '%s' "$FOODOS_PRODUCTION_READ_TOKEN" | bunx wrangler versions secret put FOODOS_PRODUCTION_READ_TOKEN --name household-state-engine --message "Sync Production read token"
          echo "FOODOS_PRODUCTION_READ_TOKEN synced to a new Worker version without exposing its value or requiring the latest deployed version."

      - name: Dispatch fresh runtime proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/cloudflare-runtime-test.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Fresh Cloudflare runtime proof dispatched from main."
