name: Sync FoodOS Airtable Runtime Secret

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: foodos-runtime-deployment-orchestrator
  cancel-in-progress: false

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Sync Airtable PAT to Cloudflare Worker version secret
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$AIRTABLE_API_KEY" ]; then
            echo "GitHub Actions AIRTABLE_API_KEY is absent."
            exit 1
          fi
          printf '%s' "$AIRTABLE_API_KEY" | bunx wrangler versions secret put AIRTABLE_API_KEY --name household-state-engine --message "Sync Airtable runtime secret"
          echo "AIRTABLE_API_KEY synced to a new Worker version without exposing its value or requiring the latest deployed version."

      - name: Sync Production read token to Cloudflare Worker version secret
        env:
          FOODOS_PRODUCTION_READ_TOKEN: ${{ secrets.FOODOS_PRODUCTION_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$FOODOS_PRODUCTION_READ_TOKEN" ]; then
            echo "GitHub Actions FOODOS_PRODUCTION_READ_TOKEN is absent."
            exit 1
          fi
          printf '%s' "$FOODOS_PRODUCTION_READ_TOKEN" | bunx wrangler versions secret put FOODOS_PRODUCTION_READ_TOKEN --name household-state-engine --message "Sync Production read token"
          echo "FOODOS_PRODUCTION_READ_TOKEN synced to a new Worker version without exposing its value or requiring the latest deployed version."

      - name: Dispatch single main runtime deployment and capture run id
        id: capture-runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/cloudflare-runtime-test.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Runtime deployment dispatch accepted for main at $dispatch_started_at."
          for attempt in $(seq 1 20); do
            response="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/cloudflare-runtime-test.yml/runs?branch=main&event=workflow_dispatch&per_page=10")"
            run_id="$(printf '%s' "$response" | jq -er --arg sha "${{ github.sha }}" --arg started "$dispatch_started_at" '
              .workflow_runs
              | map(select(.head_sha == $sha and .created_at >= $started))
              | sort_by(.created_at)
              | last
              | .id // empty' 2>/dev/null || true)"
            if [ -n "$run_id" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Fresh Cloudflare runtime deployment dispatched from main: run $run_id"
              exit 0
            fi
            echo "attempt=$attempt waiting for dispatched runtime run on SHA ${{ github.sha }}"
            sleep 3
          done
          echo "Dispatched runtime deployment run did not become observable within the capture window."
          exit 1

      - name: Wait for dispatched runtime deployment to finish
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_DEPLOY_RUN_ID: ${{ steps.capture-runtime.outputs.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$RUNTIME_DEPLOY_RUN_ID" ]; then
            echo "Dispatched runtime deployment run ID is unavailable."
            exit 1
          fi
          echo "Watching Cloudflare runtime deployment run $RUNTIME_DEPLOY_RUN_ID until completion."
          gh run watch "$RUNTIME_DEPLOY_RUN_ID" --repo "${{ github.repository }}" --interval 10 --exit-status
          run_sha="$(gh run view "$RUNTIME_DEPLOY_RUN_ID" --repo "${{ github.repository }}" --json headSha --jq '.headSha')"
          if [ "$run_sha" != "${{ github.sha }}" ]; then
            echo "Cloudflare runtime deployment $RUNTIME_DEPLOY_RUN_ID completed on unexpected SHA $run_sha; expected ${{ github.sha }}."
            exit 1
          fi
          echo "Cloudflare runtime deployment $RUNTIME_DEPLOY_RUN_ID completed successfully on current main $run_sha."

      - name: Dispatch Phase 7 runtime acceptance explicitly
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The runtime deployment is dispatched by this workflow with GITHUB_TOKEN.
          # Do not rely on a downstream workflow_run trigger: GitHub suppresses
          # token-recursive workflow chains. Explicit workflow_dispatch is the
          # supported, non-recursive handoff and keeps acceptance bound to main.
          dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run phase7-runtime-acceptance.yml --repo "$REPOSITORY" --ref main
          for attempt in $(seq 1 20); do
            response="$(gh api "repos/$REPOSITORY/actions/workflows/phase7-runtime-acceptance.yml/runs?branch=main&event=workflow_dispatch&per_page=20")"
            run_id="$(printf '%s' "$response" | jq -er --arg sha "${{ github.sha }}" --arg started "$dispatch_started_at" '
              .workflow_runs
              | map(select(.head_sha == $sha and .created_at >= $started))
              | sort_by(.created_at)
              | last
              | .id // empty' 2>/dev/null || true)"
            if [ -n "$run_id" ]; then
              echo "Phase 7 runtime acceptance dispatched on current main: run $run_id"
              exit 0
            fi
            echo "attempt=$attempt waiting for Phase 7 runtime acceptance run on SHA ${{ github.sha }}"
            sleep 3
          done
          echo "Phase 7 runtime acceptance dispatch was accepted but its run did not become observable within the capture window."
          exit 1