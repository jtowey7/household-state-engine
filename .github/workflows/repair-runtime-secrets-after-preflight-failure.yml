name: Repair FoodOS Runtime Secrets After Preflight Failure

on:
  workflow_run:
    workflows: ["Sync FoodOS Airtable Runtime Secret"]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  repair-and-redeploy:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Stage Airtable runtime secrets on a new Worker version
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          FOODOS_PRODUCTION_READ_TOKEN: ${{ secrets.FOODOS_PRODUCTION_READ_TOKEN }}
          FOODOS_OPERATOR_READ_TOKEN: ${{ secrets.FOODOS_OPERATOR_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$AIRTABLE_API_KEY"
          test -n "$FOODOS_PRODUCTION_READ_TOKEN"
          test -n "$FOODOS_OPERATOR_READ_TOKEN"
          secret_file="${RUNNER_TEMP}/foodos-runtime-secrets.json"
          jq -n \
            --arg airtable "$AIRTABLE_API_KEY" \
            --arg read_token "$FOODOS_PRODUCTION_READ_TOKEN" \
            --arg operator_token "$FOODOS_OPERATOR_READ_TOKEN" \
            '{
              AIRTABLE_API_KEY: $airtable,
              AIRTABLE_FOOD_OS_BASE_ID: "appmqDptH3taN8uby",
              AIRTABLE_HOUSEHOLD_EVENTS_TABLE: "HOUSEHOLD EVENTS",
              FOODOS_PRODUCTION_READ_TOKEN: $read_token,
              FOODOS_OPERATOR_READ_TOKEN: $operator_token
            }' > "$secret_file"
          bunx wrangler@4.125.0 versions secret bulk "$secret_file" --name household-state-engine --message "Repair active FoodOS runtime secrets"
          rm -f "$secret_file"
          echo "Active Worker secrets staged as a new version without exposing credential values."

      - name: Dispatch fresh read-only Production runtime preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cloudflare-runtime-test.yml --repo "${{ github.repository }}" --ref main -f run_production_preflight=true
          echo "Fresh Cloudflare runtime test dispatched with read-only Production preflight enabled."
