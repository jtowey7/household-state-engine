name: Repair FoodOS Runtime Secrets After Preflight Failure

on:
  workflow_run:
    workflows: ["Sync FoodOS Airtable Runtime Secret"]
    types: [completed]

permissions:
  contents: read
  actions: write

jobs:
  repair-and-redeploy:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Deploy Airtable runtime secrets to the active Worker
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          FOODOS_PRODUCTION_READ_TOKEN: ${{ secrets.FOODOS_PRODUCTION_READ_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$AIRTABLE_API_KEY"
          test -n "$FOODOS_PRODUCTION_READ_TOKEN"
          printf '%s' "$AIRTABLE_API_KEY" | bunx wrangler@4.125.0 secret put AIRTABLE_API_KEY --name household-state-engine
          printf '%s' 'appmqDptH3taN8uby' | bunx wrangler@4.125.0 secret put AIRTABLE_FOOD_OS_BASE_ID --name household-state-engine
          printf '%s' 'HOUSEHOLD EVENTS' | bunx wrangler@4.125.0 secret put AIRTABLE_HOUSEHOLD_EVENTS_TABLE --name household-state-engine
          printf '%s' "$FOODOS_PRODUCTION_READ_TOKEN" | bunx wrangler@4.125.0 secret put FOODOS_PRODUCTION_READ_TOKEN --name household-state-engine
          echo "Active Worker secrets redeployed; subsequent runtime versions will preserve them."

      - name: Dispatch fresh read-only Production runtime preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run cloudflare-runtime-test.yml --repo "${{ github.repository }}" --ref main -f run_production_preflight=true
          echo "Fresh Cloudflare runtime test dispatched with read-only Production preflight enabled."
