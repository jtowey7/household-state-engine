name: Patch PR #193 source
on:
  push:
    branches: [fix/192-protect-baseline-manifest]

jobs:
  patch-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply baseline read authorization to source only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server.ts')
          s = p.read_bytes()
          old = bytes.fromhex('')
          new = bytes.fromhex('')
          if old not in s:
              raise SystemExit('baseline route already patched or unexpected shape')
          p.write_bytes(s.replace(old, new, 1))
          PY
          git diff --check
          git add src/server.ts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: protect Production baseline manifest with read auth'
          git push
