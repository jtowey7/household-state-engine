name: FoodOS D1 Migration Diagnostic

on:
  workflow_dispatch:
    inputs:
      apply_remote:
        description: "Apply pending migrations to TEST D1 after diagnostic listing"
        required: false
        default: true
        type: boolean

jobs:
  diagnose-test-d1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15
      - name: Install dependencies
        run: bun install --frozen-lockfile --registry https://registry.npmjs.org
      - name: Prepare migration config
        run: |
          set -euo pipefail
          mkdir -p .output/server/migrations
          cp migrations/*.sql .output/server/migrations/
          node <<'NODE'
          const fs = require('fs');
          const generatedPath = '.output/server/wrangler.json';
          const generated = fs.existsSync(generatedPath) ? JSON.parse(fs.readFileSync(generatedPath, 'utf8')) : {};
          generated.d1_databases = [{ binding: 'FOODOS_RUNTIME_TEST', database_name: 'foodos-runtime-test', database_id: '78976626-2425-447b-90a7-1208bda4e983', migrations_dir: 'migrations' }];
          fs.writeFileSync(generatedPath, JSON.stringify(generated, null, 2) + '\n');
          console.log(JSON.stringify(generated.d1_databases, null, 2));
          NODE
          find .output/server/migrations -maxdepth 1 -type f -print | sort
      - name: Verify Wrangler
        run: bunx wrangler@4.125.0 --version
      - name: Diagnose remote migration state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          cd .output/server
          echo '--- Wrangler configuration ---'
          cat wrangler.json
          echo '--- Local migrations ---'
          ls -la migrations
          echo '--- Remote migration list ---'
          set +e
          bunx wrangler@4.125.0 d1 migrations list foodos-runtime-test --remote --config wrangler.json 2>&1 | tee /tmp/d1-list.log
          list_status=${PIPESTATUS[0]}
          set -e
          echo "REMOTE_MIGRATION_LIST_EXIT=$list_status"
          if [ "$list_status" -ne 0 ]; then exit "$list_status"; fi
      - name: Apply remote migrations with explicit diagnostics
        if: ${{ inputs.apply_remote }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          cd .output/server
          echo '--- Applying remote TEST D1 migrations ---'
          set +e
          bunx wrangler@4.125.0 d1 migrations apply foodos-runtime-test --remote --config wrangler.json 2>&1 | tee /tmp/d1-apply.log
          apply_status=${PIPESTATUS[0]}
          set -e
          echo "REMOTE_MIGRATION_APPLY_EXIT=$apply_status"
          if [ "$apply_status" -ne 0 ]; then exit "$apply_status"; fi
      - name: Verify remote migration state after apply
        if: ${{ inputs.apply_remote }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd .output/server
          bunx wrangler@4.125.0 d1 migrations list foodos-runtime-test --remote --config wrangler.json
