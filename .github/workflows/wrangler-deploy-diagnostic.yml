name: FoodOS Wrangler Deploy Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - redteam/fix-wrangler-args-validation

jobs:
  deploy-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile --registry https://registry.npmjs.org

      - name: Stamp build identity
        run: |
          set -euo pipefail
          mkdir -p public
          printf '%s\n' "${GITHUB_SHA}" > public/runtime-build-id.txt

      - name: Build application
        run: |
          set -euo pipefail
          bunx vitest run
          bun run lint
          bun run build

      - name: Prepare generated Wrangler config
        run: |
          set -euo pipefail
          mkdir -p .output/server/migrations
          cp migrations/*.sql .output/server/migrations/
          node <<'NODE'
          const fs = require('fs');
          const path = '.output/server/wrangler.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.d1_databases = [{
            binding: 'FOODOS_RUNTIME_TEST',
            database_name: 'foodos-runtime-test',
            database_id: '78976626-2425-447b-90a7-1208bda4e983',
            migrations_dir: 'migrations',
          }];
          config.assets = { ...(config.assets ?? {}), run_worker_first: false };
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          console.log('Wrangler config keys:', Object.keys(config).sort());
          console.log('Wrangler main:', config.main ?? null);
          console.log('Wrangler name:', config.name ?? null);
          console.log('Wrangler assets:', JSON.stringify(config.assets ?? null));
          console.log('Wrangler D1 bindings:', JSON.stringify(config.d1_databases));
          NODE

      - name: Verify Wrangler CLI and deploy argument parser
        run: |
          set -euo pipefail
          bunx wrangler@4.125.0 --version
          bunx wrangler@4.125.0 deploy --help

      - name: Deploy non-production runtime with log level from environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_LOG: debug
        run: |
          set -euo pipefail
          echo "Diagnostic deploy: same generated config, but WRANGLER_LOG=debug instead of --log-level CLI argument"
          bunx wrangler@4.125.0 deploy --config .output/server/wrangler.json
