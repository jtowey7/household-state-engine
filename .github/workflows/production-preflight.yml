name: FoodOS Production Read-Only Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Verify deployed build identity
        run: |
          set -euo pipefail
          deployed="$(curl --fail-with-body --silent --show-error --max-time 30 https://household-state-engine.jtowey7.workers.dev/runtime-build-id.txt)"
          echo "deployed_build_id=$deployed"
          if [ "$deployed" != "$GITHUB_SHA" ]; then
            echo "Deployed Worker is not serving this workflow commit."
            exit 1
          fi

      - name: Verify live runtime health
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 30 https://household-state-engine.jtowey7.workers.dev/runtime/health)"
          echo "$response"
          printf '%s' "$response" | grep -q '\"ok\":true'

      - name: Prove unauthenticated Production replay is rejected
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime/production/replay?windowStart=2026-08-15T00:00:00.000Z&windowEnd=2026-08-15T23:59:59.999Z&replayClock=2026-08-16T00:00:00.000Z&datasetId=FoodOS%20Production%20HOUSEHOLD%20EVENTS"
          status="$(curl --silent --show-error --output /tmp/replay-unauth.json --write-out '%{http_code}' --max-time 30 "$url")"
          cat /tmp/replay-unauth.json
          test "$status" = "401"

      - name: Prove authenticated read-only Production replay
        env:
          FOODOS_PRODUCTION_READ_TOKEN: ${{ secrets.FOODOS_PRODUCTION_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$FOODOS_PRODUCTION_READ_TOKEN"
          url="https://household-state-engine.jtowey7.workers.dev/runtime/production/replay?windowStart=2026-08-15T00:00:00.000Z&windowEnd=2026-08-15T23:59:59.999Z&replayClock=2026-08-16T00:00:00.000Z&datasetId=FoodOS%20Production%20HOUSEHOLD%20EVENTS"
          response="$(curl --fail-with-body --silent --show-error --max-time 60 -H "Authorization: Bearer $FOODOS_PRODUCTION_READ_TOKEN" "$url")"
          echo "$response"
          export REPLAY_RESPONSE="$response"
          node --input-type=module -e '
            const result = JSON.parse(process.env.REPLAY_RESPONSE ?? "");
            if (result.ok !== true || result.mode !== "PRODUCTION_READ_ONLY") throw new Error(`Production replay not proven: ${JSON.stringify(result)}`);
            if (result.sourceEventCount !== 210) throw new Error(`Expected 210 source events, received ${result.sourceEventCount}`);
            if (!result.snapshot?.replayId || !result.snapshot?.snapshotId) throw new Error("Replay/snapshot fingerprints missing");
            if (result.snapshot.reconciliationStatus === "BLOCKED") throw new Error("Production replay is BLOCKED");
            if (result.quantityRequirementsHandoff?.readyForQuantityRun !== true) throw new Error("QUANTITY REQUIREMENTS handoff is not ready");
            if ((result.quarantinedItemKeys ?? []).length !== 0) throw new Error(`Unexpected quarantined items: ${JSON.stringify(result.quarantinedItemKeys)}`);
            console.log(JSON.stringify({ sourceEventCount: result.sourceEventCount, replayId: result.snapshot.replayId, snapshotId: result.snapshot.snapshotId, reconciliationStatus: result.snapshot.reconciliationStatus, quantityRequirementsReady: result.quantityRequirementsHandoff.readyForQuantityRun }));
          '
