name: FoodOS Runtime Acceptance Dispatcher

on:
  workflow_run:
    workflows: ["FoodOS Phase 7 Runtime Acceptance"]
    types: [completed]
    branches: [main]

concurrency:
  group: foodos-runtime-acceptance-dispatcher
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production-preflight:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Production read-only preflight once for accepted SHA
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          echo "phase7_acceptance_sha=$ACCEPTED_SHA"
          echo "current_main_sha=$current_main_sha"
          test "$ACCEPTED_SHA" = "$current_main_sha"

          existing="$(gh run list --repo "$REPOSITORY" --workflow production-read-preflight.yml --branch main --limit 50 --json databaseId,headSha,status --jq "[.[] | select(.headSha == \"$ACCEPTED_SHA\")] | length")"
          echo "existing_preflight_runs_for_accepted_sha=$existing"
          test "$existing" = "0"

          echo "Dispatching production-read-preflight.yml with immutable accepted_sha=$ACCEPTED_SHA"
          gh workflow run production-read-preflight.yml --repo "$REPOSITORY" --ref main -f accepted_sha="$ACCEPTED_SHA"

          echo "Production read-only preflight dispatched for accepted SHA=$ACCEPTED_SHA."
