name: FoodOS Runtime Acceptance Dispatcher

on:
  workflow_run:
    workflows: ["FoodOS Cloudflare Runtime Test Deploy"]
    types: [completed]
    branches: [main]

concurrency:
  group: foodos-runtime-acceptance-dispatcher
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production-preflight:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Production read-only preflight only
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          echo "deployment_sha=$DEPLOYED_SHA"
          echo "current_main_sha=$current_main_sha"
          test "$DEPLOYED_SHA" = "$current_main_sha"

          # Phase 7 and Scheduler Runtime Acceptance already have their own
          # workflow_run triggers from the successful Cloudflare deployment.
          # Dispatching them here as well creates duplicate acceptance runs.
          echo "Dispatching production-read-preflight.yml against main"
          gh workflow run production-read-preflight.yml --repo "$REPOSITORY" --ref main

          echo "Current-main Production read-only preflight dispatched once."
