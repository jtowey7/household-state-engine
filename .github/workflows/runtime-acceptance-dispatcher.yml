name: FoodOS Runtime Acceptance Dispatcher

on:
  workflow_run:
    workflows: ["FoodOS Phase 7 Runtime Acceptance"]
    types: [completed]
    branches: [main]

concurrency:
  group: foodos-runtime-acceptance-dispatcher
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch-production-preflight:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch Production read-only preflight after Phase 7 acceptance
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ACCEPTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          current_main_sha="$(gh api "repos/$REPOSITORY/commits/main" --jq '.sha')"
          echo "phase7_acceptance_sha=$ACCEPTED_SHA"
          echo "current_main_sha=$current_main_sha"
          test "$ACCEPTED_SHA" = "$current_main_sha"

          echo "Dispatching production-read-preflight.yml against main after successful Phase 7 acceptance"
          gh workflow run production-read-preflight.yml --repo "$REPOSITORY" --ref main

          echo "Current-main Production read-only preflight dispatched once after Phase 7 acceptance."
