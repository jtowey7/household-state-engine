name: FoodOS Cloudflare Runtime Test Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: foodos-cloudflare-runtime-test
  cancel-in-progress: false

jobs:
  deploy-test-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile --registry https://registry.npmjs.org

      - name: Stamp deployed build identity
        run: |
          set -euo pipefail
          mkdir -p public
          printf '%s\n' "${GITHUB_SHA}" > public/runtime-build-id.txt

      - name: Verify application
        run: |
          bunx vitest run
          bunx prettier --write .
          bun run lint
          bun run build

      - name: Preserve D1 binding in generated Wrangler config
        run: |
          node <<'NODE'
          const fs = require('fs');
          const generatedPath = '.output/server/wrangler.json';
          const generated = JSON.parse(fs.readFileSync(generatedPath, 'utf8'));
          generated.d1_databases = [
            {
              binding: 'FOODOS_RUNTIME_TEST',
              database_name: 'foodos-runtime-test',
              database_id: '78976626-2425-447b-90a7-1208bda4e983',
              migrations_dir: 'migrations',
            },
          ];
          fs.writeFileSync(generatedPath, JSON.stringify(generated, null, 2) + '\n');
          console.log('Generated Wrangler config D1 bindings:', JSON.stringify(generated.d1_databases));
          NODE

      - name: Deploy non-production runtime to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .output/server/wrangler.json

      - name: Verify deployed build identity
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime-build-id.txt"
          echo "Checking deployed build identity at $url"
          response="$(curl --fail-with-body --silent --show-error --max-time 30 "$url")"
          echo "deployed_build_id=$response"
          if [ "$response" != "$GITHUB_SHA" ]; then
            echo "Deployed build identity mismatch: expected $GITHUB_SHA, received $response"
            exit 1
          fi

      - name: Verify live runtime health
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime/health"
          echo "Checking $url"
          for attempt in 1 2 3 4 5; do
            response="$(curl --fail-with-body --silent --show-error --max-time 15 "$url" || true)"
            echo "$response"
            if printf '%s' "$response" | grep -q '\"ok\":true'; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 5
            fi
          done
          echo "Live runtime health proof failed."
          exit 1

      - name: Inspect deployed Airtable secret names without exposing values
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bunx wrangler secret list --name household-state-engine | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const rows = JSON.parse(input);
              const names = Array.isArray(rows)
                ? rows.map((row) => row.name).filter((name) => typeof name === "string").sort()
                : [];
              const evidence = {
                secretCount: names.length,
                secretNames: names,
                airtableApiKeyPresent: names.includes("AIRTABLE_API_KEY"),
              };
              console.log(JSON.stringify(evidence));
              if (!evidence.airtableApiKeyPresent) {
                console.error("Required deployed secret AIRTABLE_API_KEY is absent; baseline read is blocked before connector execution.");
                process.exit(1);
              }
            });
          '

      - name: Read-only Production baseline manifest and connector preflight
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime/baseline/manifest"
          echo "Checking read-only baseline manifest at $url"
          response="$(curl --fail-with-body --silent --show-error --max-time 30 "$url" || true)"
          echo "$response"
          export BASELINE_RESPONSE="$response"
          node --input-type=module -e '
            import fs from "node:fs";
            const { classifyBaselinePreflight } = await import("./scripts/baseline-preflight.mjs");
            const body = process.env.BASELINE_RESPONSE;
            if (!body) throw new Error("Missing BASELINE_RESPONSE");
            const result = JSON.parse(body);
            const evidence = classifyBaselinePreflight(result);
            fs.writeFileSync("baseline-preflight.json", JSON.stringify(evidence, null, 2) + "\n");
            console.log(`BASELINE_PREFLIGHT_STATUS=${evidence.status}`);
            if (evidence.status === "EXTERNAL_BLOCKED") {
              console.log("Production connector remains fail-closed: deployed Worker Airtable credential/access is externally blocked.");
            } else {
              console.log(JSON.stringify(evidence));
            }
          '

      - name: Upload baseline preflight evidence
        if: always() && hashFiles('baseline-preflight.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: baseline-preflight-evidence
          path: baseline-preflight.json
          if-no-files-found: error

      - name: Prove read-only Production replay and QUANTITY REQUIREMENTS handoff
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime/production/replay?windowStart=2026-08-15T00:00:00.000Z&windowEnd=2026-08-15T23:59:59.999Z&replayClock=2026-08-16T00:00:00.000Z&datasetId=FoodOS%20Production%20HOUSEHOLD%20EVENTS"
          echo "Checking read-only Production replay at $url"
          response="$(curl --fail-with-body --silent --show-error --max-time 60 "$url")"
          export REPLAY_RESPONSE="$response"
          node --input-type=module -e '
            const result = JSON.parse(process.env.REPLAY_RESPONSE ?? "");
            if (result.ok !== true || result.mode !== "PRODUCTION_READ_ONLY") throw new Error(`Production replay not proven: ${JSON.stringify(result)}`);
            if (result.sourceEventCount !== 210) throw new Error(`Expected 210 source events, received ${result.sourceEventCount}`);
            if (!result.snapshot?.replayId || !result.snapshot?.snapshotId) throw new Error("Replay/snapshot fingerprints missing");
            if (result.snapshot.reconciliationStatus === "BLOCKED") throw new Error("Production replay is BLOCKED");
            if (result.quantityRequirementsHandoff?.readyForQuantityRun !== true) throw new Error("QUANTITY REQUIREMENTS handoff is not ready");
            if ((result.quarantinedItemKeys ?? []).length !== 0) throw new Error(`Unexpected quarantined items: ${JSON.stringify(result.quarantinedItemKeys)}`);
            console.log(JSON.stringify({
              sourceEventCount: result.sourceEventCount,
              replayId: result.snapshot.replayId,
              snapshotId: result.snapshot.snapshotId,
              reconciliationStatus: result.snapshot.reconciliationStatus,
              blockedItemCount: (result.snapshot.blockedItemKeys ?? []).length,
              quantityRequirementsReady: result.quantityRequirementsHandoff.readyForQuantityRun,
              quantityItemCount: result.quantityRequirementsHandoff.items.length,
            }));
          '

      - name: Prove expected-vs-confirmed consumption through TEST runtime
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime/test/expected-consumption"
          echo "Checking TEST expected-consumption proof at $url"
          response="$(curl --fail-with-body --silent --show-error --max-time 30 -X POST -H 'content-type: application/json' "$url")"
          echo "$response"
          export EXPECTED_CONSUMPTION_RESPONSE="$response"
          node --input-type=module -e '
            const result = JSON.parse(process.env.EXPECTED_CONSUMPTION_RESPONSE ?? "");
            if (result.ok !== true || result.mode !== "TEST_ONLY") throw new Error(`Expected-consumption runtime proof not proven: ${JSON.stringify(result)}`);
            const assertions = result.assertions ?? {};
            const required = [
              "pastExpectationBurned",
              "pastConfirmationBurned",
              "futureExpectationNotBurned",
              "futureConfirmationNotBurned",
              "missingProvenanceExpectationIgnored",
              "unplannedConfirmedConsumptionIsExplicit",
              "quantityHandoffUsesConfirmedState",
              "runtimeIsNonMutating",
              "deterministicReplay",
            ];
            for (const key of required) {
              if (assertions[key] !== true) throw new Error(`Expected-consumption assertion failed: ${key}`);
            }
            console.log(JSON.stringify({
              mode: result.mode,
              asOf: result.asOf,
              reconciliationStatus: result.reconciliationStatus,
              expectedEventCount: result.expectedEventCount,
              confirmedEventCount: result.confirmedEventCount,
              assertions,
            }));
          '

      - name: Prove Phase 7 TEST dispatch adapter
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime/test/dispatch-adapter"
          echo "Checking TEST dispatch adapter proof at $url"
          response="$(curl --fail-with-body --silent --show-error --max-time 30 -X POST "$url")"
          echo "$response"
          export DISPATCH_RESPONSE="$response"
          node --input-type=module -e '
            const result = JSON.parse(process.env.DISPATCH_RESPONSE ?? "");
            if (result.ok !== true || result.mode !== "TEST_ONLY" || result.phase !== "ORDER_DISPATCH") {
              throw new Error(`Dispatch adapter runtime proof not proven: ${JSON.stringify(result)}`);
            }
            for (const [key, value] of Object.entries(result.assertions ?? {})) {
              if (value !== true) throw new Error(`Dispatch adapter assertion failed: ${key}`);
            }
            console.log(JSON.stringify(result));
          '

      - name: Reset synthetic proof task through TEST-only runtime harness
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime/test/reset"
          response="$(curl --fail-with-body --silent --show-error --max-time 15 -X POST "$url")"
          echo "$response"
          printf '%s' "$response" | grep -q '\"mode\":\"TEST_ONLY\"'
          printf '%s' "$response" | grep -q '\"status\":\"READY\"'

      - name: Prove live runtime semantics
        run: bun scripts/runtime-proof.mjs

      - name: Prove live household event replay
        run: bun scripts/runtime-household-proof.mjs
