name: FoodOS Cloudflare Runtime Test Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy-test-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify application
        run: |
          bunx vitest run
          bunx prettier --write .
          bun run lint
          bun run build

      - name: Preserve D1 binding in generated Wrangler config
        run: |
          node <<'NODE'
          const fs = require('fs');
          const generatedPath = '.output/server/wrangler.json';
          const generated = JSON.parse(fs.readFileSync(generatedPath, 'utf8'));
          generated.d1_databases = [
            {
              binding: 'FOODOS_RUNTIME_TEST',
              database_name: 'foodos-runtime-test',
              database_id: '78976626-2425-447b-90a7-1208bda4e983',
              migrations_dir: 'migrations',
            },
          ];
          fs.writeFileSync(generatedPath, JSON.stringify(generated, null, 2) + '\n');
          console.log('Generated Wrangler config D1 bindings:', JSON.stringify(generated.d1_databases));
          NODE

      - name: Deploy non-production runtime to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .output/server/wrangler.json

      - name: Verify live runtime health
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime/health"
          echo "Checking $url"
          for attempt in 1 2 3 4 5; do
            response="$(curl --fail-with-body --silent --show-error --max-time 15 "$url" || true)"
            echo "$response"
            if printf '%s' "$response" | grep -q '\"ok\":true'; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 5
            fi
          done
          echo "Live runtime health proof failed."
          exit 1

      - name: Read-only Production baseline manifest and connector preflight
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime/baseline/manifest"
          echo "Checking read-only baseline manifest at $url"
          response="$(curl --fail-with-body --silent --show-error --max-time 30 "$url")"
          echo "$response"
          node -e '
            const fs = require("fs");
            const body = process.env.BASELINE_RESPONSE;
            if (!body) throw new Error("Missing BASELINE_RESPONSE");
            const result = JSON.parse(body);
            if (result.ok !== true || result.mode !== "READ_ONLY") throw new Error("Baseline endpoint did not return a read-only manifest");
            if (result.inventoryRecordCount !== 228) throw new Error(`Expected 228 inventory records, got ${result.inventoryRecordCount}`);
            if (result.reconciliationDecisionCount !== 30) throw new Error(`Expected 30 reconciliation decisions, got ${result.reconciliationDecisionCount}`);
            if (result.reconciledReady !== true) throw new Error(`Baseline is not reconciled-ready: ${result.unresolvedExceptionCount} unresolved exceptions`);
            if (!result.snapshotFingerprint || !result.baselineId || !result.reconciledBaselineId) throw new Error("Missing deterministic baseline identity");
            console.log(JSON.stringify({ok: result.ok, mode: result.mode, inventoryRecordCount: result.inventoryRecordCount, reconciliationDecisionCount: result.reconciliationDecisionCount, snapshotFingerprint: result.snapshotFingerprint, baselineId: result.baselineId, reconciledBaselineId: result.reconciledBaselineId, eventCount: result.eventCount, itemUnitGroupCount: result.itemUnitGroupCount, unresolvedExceptionCount: result.unresolvedExceptionCount, reconciledReady: result.reconciledReady}));
          ' 
        env:
          BASELINE_RESPONSE: ${{ steps.baseline.outputs.response }}

      - name: Reset synthetic proof task through TEST-only runtime harness
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime/test/reset"
          response="$(curl --fail-with-body --silent --show-error --max-time 15 -X POST "$url")"
          echo "$response"
          printf '%s' "$response" | grep -q '\"mode\":\"TEST_ONLY\"'
          printf '%s' "$response" | grep -q '\"status\":\"READY\"'

      - name: Prove live runtime semantics
        run: bun scripts/runtime-proof.mjs

      - name: Prove live household event replay
        run: bun scripts/runtime-household-proof.mjs
