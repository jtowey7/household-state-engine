name: FoodOS Cloudflare Runtime Test Deploy

on:
  workflow_dispatch:

jobs:
  deploy-test-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify application
        run: |
          bunx vitest run
          bunx prettier --write .
          bun run lint
          bun run build

      - name: Deploy non-production runtime to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config .output/server/wrangler.json

      - name: Verify live runtime health
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime/health"
          echo "Checking $url"
          for attempt in 1 2 3 4 5; do
            response="$(curl --fail-with-body --silent --show-error --max-time 15 "$url" || true)"
            echo "$response"
            if printf '%s' "$response" | grep -q '\"ok\":true'; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep 5
            fi
          done
          echo "Live runtime health proof failed."
          exit 1
