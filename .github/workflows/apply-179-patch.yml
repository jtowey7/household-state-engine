name: Apply Issue 179 patch
on:
  push:
    branches: [fix/179-test-isolation]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime claim cleanup
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/server.ts')
          s = p.read_text()
          old1 = '''WHERE status = 'CLAIMED'\n             AND lease_expires_at IS NOT NULL\n             AND lease_expires_at <= ?'''
          new1 = '''WHERE status = 'CLAIMED'\n             AND task_class = 'TEST'\n             AND lease_expires_at IS NOT NULL\n             AND lease_expires_at <= ?'''
          old2 = 'db.prepare("DELETE FROM runtime_claims WHERE lease_expires_at <= ?").bind(now),'
          new2 = '''db.prepare(\n          "DELETE FROM runtime_claims WHERE lease_expires_at <= ? AND task_id IN (SELECT task_id FROM runtime_tasks WHERE task_class = 'TEST')",\n        ).bind(now),'''
          if s.count(old1) != 1 or s.count(old2) != 1:
              raise SystemExit('Expected Issue 179 source patterns not found exactly once')
          p.write_text(s.replace(old1, new1).replace(old2, new2))
          PY
          git diff --check
          git diff -- src/server.ts
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.ts
          git commit -m 'fix: scope claim expiry cleanup to TEST tasks'
          git push
