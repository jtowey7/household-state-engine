name: Apply FoodOS delivery approval scope fix

on:
  push:
    paths:
      - '.github/workflows/apply-delivery-approval-scope-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Patch approval lookup and regression test
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          source = Path('src/lib/procurement/delivery-basket.functions.ts')
          text = source.read_text()
          old = '''  params.set("filterByFormula", basketId ? `{Basket} = '${escapeFormulaValue(basketId)}'` : "AND(OR({Approval status}='PENDING',{Approval status}='APPROVED'),{Basket payload}!='')");'''
          new = '''  params.set("filterByFormula", basketId ? `AND({Basket} = '${escapeFormulaValue(basketId)}',OR({Approval status}='PENDING',{Approval status}='APPROVED'),{Basket payload}!='')` : "AND(OR({Approval status}='PENDING',{Approval status}='APPROVED'),{Basket payload}!='')");'''
          if old not in text:
              raise SystemExit('Expected approval lookup line not found; refusing to patch.')
          source.write_text(text.replace(old, new, 1))

          test = Path('src/lib/procurement/delivery-basket.functions.test.ts')
          t = test.read_text()
          marker = '''describe("legacyDeliveryJudge", () => {'''
          insertion = '''describe("delivery basket lifecycle lookup", () => {
            it("scopes basket-id lookup to pending or approved rows with payloads", () => {
              const source = readFileSync("src/lib/procurement/delivery-basket.functions.ts", "utf8");
              expect(source).toContain("basketId ? `AND({Basket} = '${escapeFormulaValue(basketId)}',OR({Approval status}='PENDING',{Approval status}='APPROVED'),{Basket payload}!='')`");
            });
          });

          '''
          if 'import { readFileSync } from "node:fs";' in t:
              raise SystemExit('Regression import already present; refusing ambiguous edit.')
          t = 'import { readFileSync } from "node:fs";\n' + t
          if marker not in t:
              raise SystemExit('Expected delivery test marker not found; refusing to patch.')
          t = t.replace(marker, insertion + marker, 1)
          test.write_text(t)
          PY

      - name: Verify targeted tests
        run: |
          set -euo pipefail
          bun install --frozen-lockfile --registry https://registry.npmjs.org
          bunx vitest run src/lib/procurement/delivery-basket.functions.test.ts

      - name: Commit patch and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/procurement/delivery-basket.functions.ts src/lib/procurement/delivery-basket.functions.test.ts
          git commit -m "fix: scope delivery approval to active basket rows"
          git rm .github/workflows/apply-delivery-approval-scope-fix.yml
          git commit -m "chore: remove one-shot delivery fix workflow"
          git push origin HEAD:main
