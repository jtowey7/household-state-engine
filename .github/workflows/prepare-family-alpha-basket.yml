name: FoodOS Family Alpha Basket Reapproval Preparation

on:
  workflow_dispatch:
    inputs:
      runtime_url:
        description: "Deployed FoodOS Worker base URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout immutable workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Require current main ancestry
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          echo "Preparation runner pinned to $checked_out_sha"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.15

      - name: Prepare governed catalogue-verified basket
        env:
          FOODOS_BASKET_RUNTIME_URL: ${{ inputs.runtime_url }}
          FOODOS_BASKET_WRITE_TOKEN: ${{ secrets.FOODOS_BASKET_WRITE_TOKEN }}
        run: bun scripts/prepare-family-alpha-basket-for-reapproval.ts
