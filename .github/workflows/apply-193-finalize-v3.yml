name: Finalize PR #193 v3
on:
  push:
    branches: [fix/192-protect-baseline-manifest]

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded production-read fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          server = Path('src/server.ts')
          s = server.read_bytes()
          old = bytes.fromhex('')
          new = bytes.fromhex('')
          if old not in s:
              raise SystemExit('baseline route shape not found exactly')
          server.write_bytes(s.replace(old, new, 1))
          wf = Path('.github/workflows/production-read-preflight.yml')
          w = wf.read_bytes()
          old_env = bytes.fromhex('')
          new_env = bytes.fromhex('')
          if old_env not in w:
              raise SystemExit('preflight baseline call shape not found exactly')
          wf.write_bytes(w.replace(old_env, new_env, 1))
          for p in Path('.github/workflows').glob('apply-193-*.yml'):
              if p.name != 'apply-193-finalize-v3.yml':
                  p.unlink()
          PY
          git diff --check
          git diff -- src/server.ts .github/workflows/production-read-preflight.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: protect Production baseline manifest with read auth'
          git rm -f .github/workflows/apply-193-finalize-v3.yml
          git commit -m 'chore: remove one-shot baseline auth finalizer'
          git push