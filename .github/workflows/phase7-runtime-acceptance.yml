name: FoodOS Phase 7 Runtime Acceptance

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["FoodOS Cloudflare Runtime Test Deploy"]
    types: [completed]

concurrency:
  group: foodos-phase7-runtime-acceptance
  cancel-in-progress: false

jobs:
  phase7-runtime-acceptance:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Establish deployed version identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "DEPLOYED_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          else
            current_main_sha="$(curl --fail-with-body --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
              | jq -er '.sha')"
            echo "DEPLOYED_SHA=$current_main_sha" >> "$GITHUB_ENV"
          fi

      - name: Verify deployed version is current main and live Worker matches it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            | jq -er '.sha')"
          echo "deployed_sha=$DEPLOYED_SHA"
          echo "current_main_sha=$current_main_sha"
          if [ "$DEPLOYED_SHA" != "$current_main_sha" ]; then
            echo "Phase 7 runtime acceptance refused: deployed commit is not current main."
            exit 1
          fi

          url="https://household-state-engine.jtowey7.workers.dev/runtime-build-id.txt"
          live_build_sha="$(curl --fail-with-body --silent --show-error --max-time 30 "$url")"
          echo "live_build_sha=$live_build_sha"
          if [ "$live_build_sha" != "$current_main_sha" ]; then
            echo "Phase 7 runtime acceptance refused: live Worker build is not current main."
            exit 1
          fi

      - name: Prove deployed Phase 7 dispatch adapter
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime/test/dispatch-adapter"
          response="$(curl --fail-with-body --silent --show-error --max-time 30 -X POST "$url")"
          echo "$response"
          export DISPATCH_RESPONSE="$response"
          node --input-type=module -e '
            const result = JSON.parse(process.env.DISPATCH_RESPONSE ?? "");
            if (result.ok !== true || result.mode !== "TEST_ONLY" || result.phase !== "ORDER_DISPATCH") {
              throw new Error(`Phase 7 runtime proof not proven: ${JSON.stringify(result)}`);
            }
            const assertions = result.assertions ?? {};
            const failed = Object.entries(assertions).filter(([, value]) => value !== true);
            if (failed.length) throw new Error(`Phase 7 assertion failure: ${JSON.stringify(failed)}`);
            const boundary = result.boundaryEvidence ?? {};
            if (boundary.householdMutation !== "NOT_EXECUTED") throw new Error(`Household mutation boundary not explicit: ${JSON.stringify(boundary)}`);
            if (boundary.retailerIo !== "NOT_EXECUTED") throw new Error(`Retailer I/O boundary not explicit: ${JSON.stringify(boundary)}`);
            if (boundary.externalConcurrencyIdempotency !== "NOT_EXECUTED") throw new Error(`External concurrency idempotency must remain explicitly unproven: ${JSON.stringify(boundary)}`);
            if (boundary.receiptPersistence !== "D1_RUNTIME_TEST" || boundary.concurrencyModel !== "D1_RUNTIME_TEST") {
              throw new Error(`D1-backed TEST persistence was not proven: ${JSON.stringify(boundary)}`);
            }
            if (assertions.adapterRecreationPersistence !== true) {
              throw new Error(`D1 adapter-recreation persistence assertion was not proven: ${JSON.stringify(assertions)}`);
            }
            const evidence = {
              status: "TEST_PROVEN",
              mode: result.mode,
              phase: result.phase,
              deployedSha: process.env.DEPLOYED_SHA,
              assertions,
              boundaryEvidence: boundary,
              evidence: result.evidence ?? null,
              timestamp: new Date().toISOString(),
            };
            require("node:fs").writeFileSync("phase7-runtime-acceptance.json", JSON.stringify(evidence, null, 2) + "\n");
            console.log(JSON.stringify(evidence));
          '

      - name: Upload Phase 7 runtime evidence
        if: always() && hashFiles('phase7-runtime-acceptance.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase7-runtime-acceptance-evidence
          path: phase7-runtime-acceptance.json
          if-no-files-found: error
