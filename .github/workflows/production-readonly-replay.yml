name: FoodOS Production Read-Only Replay

on:
  workflow_dispatch:
    inputs:
      airtable_base_id:
        description: "Canonical Food OS Airtable base ID"
        required: true
        type: string
      replay_as_of:
        description: "Production replay cutoff date (YYYY-MM-DD)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-readonly-replay
  cancel-in-progress: false

jobs:
  replay:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
      AIRTABLE_BASE_ID: ${{ inputs.airtable_base_id }}
      AIRTABLE_FOOD_OS_BASE_ID: ${{ inputs.airtable_base_id }}
      AIRTABLE_HOUSEHOLD_EVENTS_TABLE: HOUSEHOLD EVENTS
      FOODOS_REPLAY_AS_OF: ${{ inputs.replay_as_of }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require checkout to equal current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" | jq -er '.sha')"
          checked_out_sha="$(git rev-parse HEAD)"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$checked_out_sha" = "$current_main_sha"
          echo "main_sha=$checked_out_sha"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate read-only replay inputs
        run: |
          set -euo pipefail
          test -n "$AIRTABLE_API_KEY"
          test -n "$AIRTABLE_BASE_ID"
          test -n "$AIRTABLE_FOOD_OS_BASE_ID"
          test "$AIRTABLE_BASE_ID" = "$AIRTABLE_FOOD_OS_BASE_ID"
          test "$AIRTABLE_HOUSEHOLD_EVENTS_TABLE" = "HOUSEHOLD EVENTS"
          test -n "$FOODOS_REPLAY_AS_OF"

      - name: Execute read-only production replay
        run: |
          bun run replay:production --as-of "$FOODOS_REPLAY_AS_OF" --base "$AIRTABLE_BASE_ID"
