name: Finalize PR #193
on:
  push:
    branches: [fix/192-protect-baseline-manifest]

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply guarded production-read fix
        run: |
          python - <<'PY'
          from pathlib import Path
          server = Path('src/server.ts')
          s = server.read_text()
          old = '''  if (url.pathname === "/runtime/baseline/manifest" && request.method === "GET") {
    try {
      const boundEnv = await getCloudflareEnvironment();
      const env = buildAirtableRequestEnvironment(boundEnv, workerEnv as WorkerEnvironment | undefined);'''
          new = '''  if (url.pathname === "/runtime/baseline/manifest" && request.method === "GET") {
    const boundEnv = await getCloudflareEnvironment();
    const authorization = await authorizeProductionRead(request, boundEnv, workerEnv as WorkerEnvironment | undefined);
    if (authorization) return authorization;

    try {
      const env = buildAirtableRequestEnvironment(boundEnv, workerEnv as WorkerEnvironment | undefined);'''
          if old not in s:
              raise SystemExit('baseline route shape not found')
          server.write_text(s.replace(old, new, 1))

          wf = Path('.github/workflows/production-read-preflight.yml')
          w = wf.read_text()
          old_env = '''      - name: Read-only baseline manifest
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --max-time 30 "https://household-state-engine.jtowey7.workers.dev/runtime/baseline/manifest")"'''
          new_env = '''      - name: Read-only baseline manifest
        env:
          FOODOS_PRODUCTION_READ_TOKEN: ${{ secrets.FOODOS_PRODUCTION_READ_TOKEN }}
        run: |
          set -euo pipefail
          unauth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "https://household-state-engine.jtowey7.workers.dev/runtime/baseline/manifest")"
          test "$unauth_status" = "401"
          response="$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $FOODOS_PRODUCTION_READ_TOKEN" "https://household-state-engine.jtowey7.workers.dev/runtime/baseline/manifest")"'''
          if old_env not in w:
              raise SystemExit('preflight baseline call shape not found')
          wf.write_text(w.replace(old_env, new_env, 1))

          finalizer = Path('.github/workflows/apply-193-finalize.yml')
          finalizer.unlink()
          PY
          git diff --check
          git add src/server.ts .github/workflows/production-read-preflight.yml .github/workflows/apply-193-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: protect Production baseline manifest with read auth'
          git push
