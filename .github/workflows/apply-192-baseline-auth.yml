name: Apply #192 baseline manifest auth patch
on:
  push:
    branches: [fix/192-protect-baseline-manifest]

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch baseline manifest auth and preflight
        run: |
          python - <<'PY'
          from pathlib import Path
          server = Path('src/server.ts')
          s = server.read_text()
          old = '''  if (url.pathname === "/runtime/baseline/manifest" && request.method === "GET") {\n    try {\n      const boundEnv = await getCloudflareEnvironment();'''
          new = '''  if (url.pathname === "/runtime/baseline/manifest" && request.method === "GET") {\n    const boundEnv = await getCloudflareEnvironment();\n    const authorization = await authorizeProductionRead(request, boundEnv, workerEnv as WorkerEnvironment | undefined);\n    if (authorization) return authorization;\n\n    try {\n      const boundEnv = await getCloudflareEnvironment();'''
          if s.count(old) != 1:
              raise SystemExit('expected baseline manifest route shape not found exactly once')
          s = s.replace(old, new)
          server.write_text(s)

          wf = Path('.github/workflows/production-read-preflight.yml')
          w = wf.read_text()
          old_env = '''      - name: Read-only baseline manifest\n        run: |\n          set -euo pipefail\n          response="$(curl --fail-with-body --silent --show-error --max-time 30 "https://household-state-engine.jtowey7.workers.dev/runtime/baseline/manifest")"'''
          new_env = '''      - name: Read-only baseline manifest\n        env:\n          FOODOS_PRODUCTION_READ_TOKEN: ${{ secrets.FOODOS_PRODUCTION_READ_TOKEN }}\n        run: |\n          set -euo pipefail\n          unauth_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "https://household-state-engine.jtowey7.workers.dev/runtime/baseline/manifest")"\n          test "$unauth_status" = "401"\n          response="$(curl --fail-with-body --silent --show-error --max-time 30 -H "Authorization: Bearer $FOODOS_PRODUCTION_READ_TOKEN" "https://household-state-engine.jtowey7.workers.dev/runtime/baseline/manifest")"'''
          if w.count(old_env) != 1:
              raise SystemExit('expected preflight baseline call shape not found exactly once')
          wf.write_text(w.replace(old_env, new_env))
          PY
          git diff --check
          git diff -- src/server.ts .github/workflows/production-read-preflight.yml
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/server.ts .github/workflows/production-read-preflight.yml
          if git diff --cached --quiet; then
            echo 'Patch already present'
          else
            git commit -m 'fix: protect Production baseline manifest with read auth'
            git push
          fi
