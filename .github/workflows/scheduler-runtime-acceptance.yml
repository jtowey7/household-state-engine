name: FoodOS Scheduler Runtime Acceptance

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["FoodOS Cloudflare Runtime Test Deploy"]
    types: [completed]

concurrency:
  group: foodos-scheduler-runtime-acceptance
  cancel-in-progress: false

jobs:
  scheduler-runtime-acceptance:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Establish unique scheduler wake for this acceptance run
        run: |
          set -euo pipefail
          echo "WAKE_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "DEPLOYED_SHA=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_ENV"
          else
            echo "DEPLOYED_SHA=manual-dispatch" >> "$GITHUB_ENV"
          fi

      - name: Verify scheduler runtime is current main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/main" \
            | jq -er '.sha')"
          echo "current_main_sha=$current_main_sha"

          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "deployed_sha=$DEPLOYED_SHA"
            if [ "$DEPLOYED_SHA" != "$current_main_sha" ]; then
              echo "Scheduler runtime acceptance refused: deployment is not current main."
              exit 1
            fi
          fi

          # runtime-build-id.txt is a static asset and may be edge-cached. Bind the
          # cache key to the expected SHA so a stale POP cannot masquerade as the live build.
          url="https://household-state-engine.jtowey7.workers.dev/runtime-build-id.txt?expected_sha=$current_main_sha"
          live_build_sha="$(curl --fail-with-body --silent --show-error --max-time 30 "$url")"
          echo "live_build_sha=$live_build_sha"
          if [ "$live_build_sha" != "$current_main_sha" ]; then
            echo "Scheduler runtime acceptance refused: live Worker build is not current main."
            exit 1
          fi
          echo "DEPLOYED_SHA=$current_main_sha" >> "$GITHUB_ENV"

      - name: Wait for deployed TEST runtime scheduler endpoint
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime/test/scheduler-cycle"
          payload=$(node --input-type=module -e 'console.log(JSON.stringify({wakeAt: process.env.WAKE_AT}))')
          for attempt in $(seq 1 20); do
            response="$(curl --silent --show-error --max-time 10 -X POST -H 'content-type: application/json' --data "$payload" "$url" || true)"
            echo "Attempt $attempt: $response"
            if printf '%s' "$response" | grep -q '\"phase\":\"FIRST\"'; then
              export FIRST_RESPONSE="$response"
              break
            fi
            if [ "$attempt" -lt 20 ]; then sleep 5; fi
          done

          if [ -z "${FIRST_RESPONSE:-}" ]; then
            echo "Deployed TEST scheduler endpoint did not return a FIRST proof within the wait window."
            exit 1
          fi

          node --input-type=module -e '
            const result = JSON.parse(process.env.FIRST_RESPONSE);
            if (result.ok !== true || result.mode !== "TEST_ONLY" || result.phase !== "FIRST") {
              throw new Error(`Scheduler FIRST proof failed: ${JSON.stringify(result)}`);
            }
            const required = {
              highestPriorityDirective: true,
              executed: true,
              replayCompleted: true,
              approvalUnGranted: true,
              mutatedHouseholdState: false,
              appendedEvents: false,
              dispatched: false,
            };
            for (const [key, expected] of Object.entries(required)) {
              if (result.assertions?.[key] !== expected) {
                throw new Error(`Scheduler FIRST assertion failed: ${key} expected ${expected}, received ${result.assertions?.[key]}`);
              }
            }
            if (!(result.assertions?.quantityRequirementsProduced > 0)) throw new Error("Scheduler produced no quantity requirements");
            if (!result.assertions?.basketProduced) throw new Error("Scheduler produced no basket");
            console.log(JSON.stringify({
              phase: result.phase,
              directive: result.first.directiveSelected,
              outcome: result.first.outcome,
              quantityRequirementsProduced: result.assertions.quantityRequirementsProduced,
              basketProduced: result.assertions.basketProduced,
              approvalGranted: result.first.approvalGranted,
              mutatedHouseholdState: result.assertions.mutatedHouseholdState,
              appendedEvents: result.assertions.appendedEvents,
              dispatched: result.assertions.dispatched,
              deployedSha: process.env.DEPLOYED_SHA,
            }));
          '

      - name: Prove duplicate wake-up remains inert
        run: |
          set -euo pipefail
          url="https://household-state-engine.jtowey7.workers.dev/runtime/test/scheduler-cycle"
          payload=$(node --input-type=module -e 'console.log(JSON.stringify({wakeAt: process.env.WAKE_AT}))')
          response="$(curl --fail-with-body --silent --show-error --max-time 30 -X POST -H 'content-type: application/json' --data "$payload" "$url")"
          echo "$response"
          export DUPLICATE_RESPONSE="$response"
          node --input-type=module -e '
            const result = JSON.parse(process.env.DUPLICATE_RESPONSE);
            if (result.ok !== true || result.mode !== "TEST_ONLY" || result.phase !== "DUPLICATE") {
              throw new Error(`Scheduler DUPLICATE proof failed: ${JSON.stringify(result)}`);
            }
            const required = {
              duplicateWakeInert: true,
              mutatedHouseholdState: false,
              appendedEvents: false,
              dispatched: false,
            };
            for (const [key, expected] of Object.entries(required)) {
              if (result.assertions?.[key] !== expected) {
                throw new Error(`Scheduler DUPLICATE assertion failed: ${key} expected ${expected}, received ${result.assertions?.[key]}`);
              }
            }
            if (!result.duplicate?.duplicateWakeOf) throw new Error("Duplicate wake did not identify its original cycle");
            console.log(JSON.stringify({
              phase: result.phase,
              duplicateWakeOf: result.duplicate.duplicateWakeOf,
              workPerformed: result.duplicate.workPerformed,
              mutatedHouseholdState: result.assertions.mutatedHouseholdState,
              appendedEvents: result.assertions.appendedEvents,
              dispatched: result.assertions.dispatched,
            }));
          '
